# User-supplied rules, this file stands in for "the compliance checklist the user hands the system"

rules:
  - id: completeness.required_docs_present
    stage: completeness
    description: Every loan file must have an application, a credit report, and an appraisal on file.
    check: required_doc_types_present
    params:
      required: [application, credit_report, appraisal]

  - id: accuracy.loan_amount_consistent
    stage: accuracy
    description: If an amendment exists, loan_amount must not have an unresolved conflict.
    check: loan_amount_consistent

  - id: consistency.no_embedded_instructions
    stage: consistency
    description: No document should contain text attempting to direct the system's behavior.
    check: no_embedded_instructions
  
  - id: regulatory.appraisal_recency
    stage: regulatory
    description: Appraisal date must be within 120 days of application date.
    check: appraisal_recency
    params:
      max_days: 120