services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: loanfile
      POSTGRES_PASSWORD: loanfile
      POSTGRES_DB: loanfile
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loanfile"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata: